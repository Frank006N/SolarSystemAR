<!DOCTYPE html>
<html>
  <head>
    <title>SolarSystemAR | Francis Mugo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- A-Frame Core -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <!-- AR.js with NFT Support -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
      #ui-layer { 
        position: absolute; top: 20px; left: 50%; transform: translateX(-50%); 
        z-index: 10; color: white; background: rgba(0, 0, 0, 0.7); 
        padding: 15px 25px; border-radius: 30px; text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.3);
      }
      .status { font-size: 0.8rem; color: #4CC3D9; margin-top: 5px; }
    </style>
  </head>
  <body>
    <div id="ui-layer">
      <h3>🌌 Solar System AR</h3>
      <div class="status">Point camera at the Marker</div>
    </div>

    <a-scene embedded arjs='sourceType: webcam; debugUIEnabled: false;'>
      
      <!-- OPTION 1: NFT Marker (Solar System Map) -->
      <!-- This will activate once you have marker.fset and marker.iset -->
      <a-nft type="nft" url="./markers/solar-system/marker" smooth='true' smoothCount='10'>
        <a-entity position="0 0 0">
          <a-sphere position="0 0.5 0" radius="0.25" color="#FDB813" shader="flat"></a-sphere>
          <a-gltf-model src="./assets/models/earth.glb" scale="0.15 0.15 0.15" position="1.2 0 0"></a-gltf-model>
        </a-entity>
      </a-nft>

      <!-- OPTION 2: Hiro Marker (Fallback for Testing) -->
      <a-marker preset="hiro">
        <a-box position="0 0.5 0" material="color: #EF2D5E"></a-box>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
