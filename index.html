<!DOCTYPE html>
<html>
  <head>
    <title>SolarSystemAR | Interactive Portfolio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <!-- A-Frame Core -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <!-- AR.js -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    <!-- Touch Controls for Zoom/Rotate -->
    <script src="https://unpkg.com/aframe-arjs-touch-controls@1.0.0/dist/aframe-arjs-touch-controls.min.js"></script>

    <style>
      body { margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; }
      #ui-layer { 
        position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); 
        z-index: 10; color: white; background: rgba(255, 255, 255, 0.1); 
        backdrop-filter: blur(10px); padding: 12px 24px; border-radius: 50px; 
        border: 1px solid rgba(255, 255, 255, 0.2); text-align: center;
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
      }
      h3 { margin: 0; font-size: 1rem; font-weight: 600; letter-spacing: 0.5px; }
      p { margin: 2px 0 0 0; font-size: 0.75rem; opacity: 0.8; }
    </style>
  </head>
  <body>
    <div id="ui-layer">
      <h3>SOLAR SYSTEM AR</h3>
      <p>Pinch to Zoom • Drag to Rotate</p>
    </div>

    <a-scene embedded arjs='sourceType: webcam; debugUIEnabled: false;' vr-mode-ui="enabled: false">
      
      <a-assets>
        <img id="sun-tex" src="./assets/textures/sun.jpg" crossorigin="anonymous">
        <img id="earth-tex" src="./assets/textures/earth.jpg" crossorigin="anonymous">
        <img id="mars-tex" src="./assets/textures/mars.jpg" crossorigin="anonymous">
        <img id="star-tex" src="./assets/textures/stars.jpg" crossorigin="anonymous">
      </a-assets>

      <!-- Starfield -->
      <a-sphere radius="100" material="src: #star-tex; side: back; transparent: true; opacity: 0.9"></a-sphere>

      <!-- Lighting -->
      <a-light type="point" intensity="2" position="0 1 0" castShadow="true"></a-light>
      <a-light type="ambient" intensity="0.3"></a-light>

      <a-marker preset="hiro">
        <a-entity position="0 0 0">
          <!-- Sun -->
          <a-sphere position="0 0.5 0" radius="0.3" material="src: #sun-tex; shader: flat"></a-sphere>
          
          <!-- Earth System -->
          <a-entity animation="property: rotation; to: 0 360 0; dur: 15000; easing: linear; loop: true">
            <a-entity position="1.0 0.5 0">
              <a-sphere radius="0.12" material="src: #earth-tex"></a-sphere>
              <!-- Moon -->
              <a-sphere position="0.25 0 0" radius="0.03" color="#CCCCCC"></a-sphere>
            </a-entity>
          </a-entity>

          <!-- Mars -->
          <a-entity animation="property: rotation; to: 0 360 0; dur: 25000; easing: linear; loop: true">
            <a-sphere position="1.6 0.5 0" radius="0.09" material="src: #mars-tex"></a-sphere>
          </a-entity>
        </a-entity>
      </a-marker>

      <!-- Camera with Touch Controls -->
      <a-entity camera look-controls="touchEnabled: true" wasd-controls-enabled="false"></a-entity>
    </a-scene>
  </body>
</html>
