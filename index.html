<!DOCTYPE html>
<html>
  <head>
    <title>SolarSystemAR | Francis Mugo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    <style>
      body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
      #ui-layer { 
        position: absolute; top: 20px; left: 50%; transform: translateX(-50%); 
        z-index: 10; color: white; background: rgba(0, 0, 0, 0.7); 
        padding: 15px 25px; border-radius: 30px; text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="ui-layer">
      <h3>🌌 Solar System AR</h3>
      <p>Point camera at the Marker</p>
    </div>

    <a-scene embedded arjs='sourceType: webcam; debugUIEnabled: false;'>
      
      <!-- Starfield Background -->
      <a-sphere radius="100" material="src: ./assets/textures/stars.jpg; side: back; transparent: true; opacity: 0.9"></a-sphere>

      <!-- Hiro Marker (Testing) -->
      <a-marker preset="hiro">
        <a-entity position="0 0 0">
          <!-- The Sun -->
          <a-sphere position="0 0.5 0" radius="0.25" color="#FDB813" shader="flat" animation="property: scale; to: 1.1 1.1 1.1; dir: alternate; dur: 2000; loop: true"></a-sphere>
          
          <!-- Earth Orbit -->
          <a-entity animation="property: rotation; to: 0 360 0; dur: 10000; easing: linear; loop: true">
            <a-entity position="1.2 0 0">
              <a-gltf-model src="./assets/models/earth.glb" scale="0.15 0.15 0.15" animation="property: rotation; to: 0 360 0; dur: 4000; loop: true"></a-gltf-model>
            </a-entity>
          </a-entity>
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
